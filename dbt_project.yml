name: 'snowplow_identities'
version: '0.2.0'
config-version: 2

require-dbt-version: [">=1.10.6", "<2.0.0"]

profile: 'default'

dispatch:
  - macro_namespace: dbt
    search_order: ['snowplow_utils', 'dbt']

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
docs-paths: ["docs"]
clean-targets:
  - "target"
  - "dbt_packages"

models:
  snowplow_identities:
    +materialized: table
    +file_format: "{{ 'delta' if target.type not in ['spark'] else 'iceberg'}}"
    +incremental_strategy: "{{ None if target.type not in ['spark'] else 'merge' }}"
    +bind: false
    +schema: "derived"
    staging:
      +schema: "scratch"
      +tags: "staging"

vars:
  snowplow_identities:
    # OPERATION & LOGIC
    snowplow__start_date: '2026-01-01' # The date from which to start processing events
    snowplow__hash_identifiers: false # Set to true to hash identifiers before processing (recommended for PII compliance)
    snowplow__identifiers: [{'reference': 'domain_userid', 'alias': 'domain_userid'}, {'reference': 'user_id', 'alias': 'user_id'}] # List of identifiers to process.
    snowplow__backfill_limit_days: 30 # New days of data each model advances per run. A floor, not a cap: a model behind snowplow_identities_stg_identity_events extends its window to that model's watermark.
    snowplow__lookback_days: 1 # Days of overlap re-scanned each run for late-arriving data. Also the run-twice idempotency window.
    # filter your data:
    snowplow__merge_limit_collapse: false # Marks the identity holding an identifier's most recent sighting as is_preferred when the identifier sits under several. Covers both a merge the service refused at its limit and an identifier that expired and came back under a new identity. ONLY safe when no identifier is configured as unique in the identity service.
    snowplow__app_id: [] # Restricts which of your own applications' events are processed. Empty means all.
    snowplow__identities_app_id: ['snowplow-identities'] # app_id the identity service emits its own events under. Empty means no filter.

    # WAREHOUSE & TRACKER
    snowplow__databricks_catalog: "hive_metastore"
    # snowplow__atomic_schema: 'atomic' # Only set if not using 'atomic' schema for Snowplow events data
    snowplow__partition_tstamp: "load_tstamp" # The column atomic.events is physically partitioned by. Set to 'collector_tstamp' if that is your partition key, so staging scans still prune.
    snowplow__partition_tstamp_type: "timestamp" # Type of snowplow__partition_tstamp: 'timestamp' or 'date'. Set to 'date' when the partition column is a DATE, so the prune predicate uses matching-typed bounds.
    snowplow__partition_buffer_days: 2 # Extra days added to the partition-prune predicate to absorb collector-to-load lag when snowplow__partition_tstamp is not load_tstamp.
    # snowplow__database: # Only set if not using target.database for Snowplow events data -- WILL BE IGNORED FOR DATABRICKS
    # snowplow__events_table: "events" # Only set if not using 'events' table for Snowplow events data
    # PRIVATE VARS - DO NOT MODIFY
    snowplow__events: "{{ source('atomic', 'events') }}"

    # LICENSE
    snowplow__license_accepted: false

on-run-start:
  - "{{ snowplow_utils.license_check(var('snowplow__license_accepted')) }}"
on-run-end:
  - "{{ snowplow_utils.grant_usage_on_schemas_built_into(var('snowplow__grant_schemas', true)) }}"
flags:
  require_generic_test_arguments_property: true
