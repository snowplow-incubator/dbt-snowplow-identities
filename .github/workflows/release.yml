name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: identities-release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Read version and release notes
        id: package
        run: |
          python - <<'PY'
          import os
          import re
          from pathlib import Path

          project = Path('dbt_project.yml').read_text()
          version = re.search(r"^version: '([^']+)'$", project, re.MULTILINE).group(1)
          if not re.fullmatch(r'\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?', version):
              raise SystemExit('Invalid package version')
          changelog = Path('CHANGELOG').read_text()
          sections = re.split(r'^snowplow_identities ([^\s]+) \(\d{4}-\d{2}-\d{2}\)\n-+\n', changelog, flags=re.MULTILINE)
          notes = next((sections[i + 1].strip() for i in range(1, len(sections), 2) if sections[i] == version), '')
          if not notes:
              raise SystemExit(f'Missing dated changelog entry for {version}')
          Path('release-notes.md').write_text(notes + '\n')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'version={version}\n')
          PY
      - name: Publish new version
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.package.outputs.version }}
        run: |
          if gh release view "$VERSION" > /dev/null 2>&1; then
            echo "Release $VERSION already exists."
            exit 0
          fi
          if git rev-parse --verify "refs/tags/$VERSION" > /dev/null 2>&1; then
            test "$(git rev-list -n 1 "$VERSION")" = "$GITHUB_SHA"
          fi
          args=(--target "$GITHUB_SHA" --title "snowplow_identities v$VERSION" --notes-file release-notes.md)
          if [[ "$VERSION" == *-* ]]; then
            args+=(--prerelease)
          fi
          gh release create "$VERSION" "${args[@]}"
