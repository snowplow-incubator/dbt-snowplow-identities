name: generate-docs-pages

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - .github/workflows/publish-gh-pages.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: identities-docs-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: integration_tests
    env:
      DBT_PROFILES_DIR: ./ci
      DBT_SEND_ANONYMOUS_USAGE_STATS: 'false'
      DEFAULT_TARGET: snowflake
      SCHEMA_SUFFIX: ${{ github.run_id }}_${{ github.run_attempt }}_docs
      SNOWFLAKE_TEST_ACCOUNT: ${{ secrets.SNOWFLAKE_TEST_ACCOUNT }}
      SNOWFLAKE_TEST_USER: ${{ secrets.SNOWFLAKE_TEST_USER }}
      SNOWFLAKE_TEST_PRIVATE_KEY: ${{ secrets.SNOWFLAKE_TEST_PRIVATE_KEY }}
      SNOWFLAKE_TEST_ROLE: ${{ secrets.SNOWFLAKE_TEST_ROLE }}
      SNOWFLAKE_TEST_DATABASE: ${{ secrets.SNOWFLAKE_TEST_DATABASE }}
      SNOWFLAKE_TEST_WAREHOUSE: ${{ secrets.SNOWFLAKE_TEST_WAREHOUSE }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install latest dbt 1.x dependencies
        run: |
          python -m pip install --upgrade pip wheel setuptools
          python -m pip install 'dbt-core==1.*' 'dbt-snowflake==1.*'
          dbt deps
      - name: Check warehouse connection
        id: connection
        run: dbt debug --target snowflake
      - name: Build documentation fixture
        run: |
          dbt seed --target snowflake --full-refresh
          dbt run --target snowflake --full-refresh --vars '{snowplow__allow_refresh: true, snowplow__backfill_limit_days: 243}'
      - name: Generate documentation
        run: |
          dbt docs generate --target snowflake \
            --vars "{snowplow__atomic_schema: gh_sp_identities_dbt_${SCHEMA_SUFFIX}_snplw_identities_int_tests}"
          mkdir -p docs-site
          cp target/catalog.json target/manifest.json target/run_results.json target/index.html docs-site/
      - name: Clean isolated test schemas
        if: ${{ always() && steps.connection.outcome == 'success' }}
        run: dbt run-operation post_ci_cleanup --target snowflake
      - uses: actions/upload-pages-artifact@v4
        with:
          path: integration_tests/docs-site

  deploy:
    if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish documentation
        id: deployment
        uses: actions/deploy-pages@v4
