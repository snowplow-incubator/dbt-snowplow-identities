name: SQL regressions
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sql_regressions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r integration_tests/python/requirements.txt
      - run: python -m pytest integration_tests/python -q
