version: 2

macros:
  - name: get_cluster_by_values
    description: '{{ doc("macro_get_cluster_by_values") }}'
    arguments:
      - name: model
        type: string
        description: Short name of model to select which fields to cluster by
  - name: get_incremental_filter
    description: '{{ doc("macro_get_incremental_filter") }}'
    arguments:
      - name: relation_alias
        type: string
        description: Alias of the source relation in the query (e.g. 'e'), or none if the query does not alias it.
      - name: use_atomic_partition
        type: bool
        description: >
          Set true for staging models reading atomic.events, to also emit a predicate on
          atomic's physical partition column so the warehouse can prune. Configure with
          snowplow__partition_tstamp and snowplow__partition_tstamp_type.
      - name: anchor
        type: bool
        description: >
          Extend the window's upper bound to snowplow_identities_stg_identity_events'
          watermark when the model's own is behind it. Leave true for every model except
          stg_identity_events itself, which is the anchor. Without it a model whose events
          are sparser than snowplow__backfill_limit_days strands itself, since an empty
          window leaves its watermark, and therefore the window, unchanged.
  - name: array_union
    description: >
      Sorted, deduplicated union of two string arrays, treating null as empty. Dispatched
      per warehouse.
    arguments:
      - name: a
        type: string
        description: Expression yielding an array, or null.
      - name: b
        type: string
        description: Expression yielding an array, or null.
  - name: reason_array_type
    description: >
      The warehouse's type for a decision_reasons array, for casting a null that feeds
      array_union when the stored side of the union does not exist yet. Dispatched per
      warehouse.
  - name: array_concat_agg
    description: >
      Aggregate. Concatenates every array in the group, duplicates included. Pair it with
      array_sort_distinct in the next CTE: BigQuery cannot aggregate arrays and deduplicate
      them in the same select. Dispatched per warehouse.
    arguments:
      - name: col
        type: string
        description: Name of an array column, whose nulls count as empty.
  - name: array_sort_distinct
    description: >
      Sorted, deduplicated copy of one array, treating null as empty. Dispatched per
      warehouse.
    arguments:
      - name: col
        type: string
        description: Expression yielding an array, or null.
  - name: bool_or_agg
    description: >
      Aggregate. True when the expression is true for any row in the group. The expression
      must never be null: every dialect's native aggregate ignores null rows, so a group of
      nothing but nulls comes back null rather than false. Dispatched per warehouse.
    arguments:
      - name: expr
        type: string
        description: Boolean expression evaluated per row, never null.
  - name: extract_merged
    description: >
      Flattens the cumulative `merged` array of a merge-events relation into one row per
      (parent, child) edge. Dispatched per warehouse.
    arguments:
      - name: source_relation
        type: string
        description: >
          Name of a CTE or relation carrying active_snowplow_id, merge_event_id, merged
          and load_tstamp.
