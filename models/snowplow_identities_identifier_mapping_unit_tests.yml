  - name: test__snowplow_identities_identifier_mapping__frozen_identifier_left_untouched
    description: >
      Merge limit collapse. X has a leftover row under sp_B, which was merged
      into sp_C in an earlier run, and a row under sp_NOAGE, which has no
      created_at. sp_NOAGE puts X on the skip list, so the promise is: write
      the new sp_D row from this batch and touch nothing else. The bug was
      that the leftover row had already been rewritten to sp_C before the
      skip list was checked, so the model emitted a brand-new (sp_C, X) row
      for an identifier it claimed to have left alone.
    model: snowplow_identities_identifier_mapping
    overrides:
      vars:
        snowplow__merge_limit_collapse: true
      macros:
        is_incremental: true
        snowplow_utils.is_run_with_new_events: "true"
    given:
      - input: ref('snowplow_identities_identifier_mapping_this_run')
        rows:
          - {uuid: 'uuid-dx', active_snowplow_id: 'sp_DDDD', id_type: 'DOMAIN_USERID', id_value: 'shared-x', first_app_id: 'web', last_app_id: 'web', first_seen_at: '2026-01-13 10:00:00.000', last_seen_at: '2026-01-13 10:00:00.000', first_seen_event_id: 'evt-dx'}
      - input: ref('snowplow_identities_snowplow_id_mapping_this_run')
        rows: []
      - input: ref('snowplow_identities_snowplow_id_mapping')
        rows:
          - {snowplow_id: 'sp_BBBB', active_snowplow_id: 'sp_CCCC', merged_at: '2026-01-05 00:00:00.000', model_tstamp: '2026-01-05 00:05:00.000'}
      - input: ref('snowplow_identities_new_identities')
        rows:
