        - {active_snowplow_id: 'sp_YOUNG', id_type: 'domain_userid', id_value: 'user-linked', first_app_id: 'web', last_app_id: 'web', first_seen_at: '2025-12-18 10:00:00.000', last_seen_at: '2025-12-18 10:00:00.000', first_seen_event_id: 'evt-young', mapping_state: 'merge_limited', is_preferred: false}

  - name: test__snowplow_identities_identifier_mapping__chained_short_visit_still_collapses
    description: >
