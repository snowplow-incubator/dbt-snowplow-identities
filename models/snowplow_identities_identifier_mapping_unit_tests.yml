          - {uuid: 'uuid-nx', active_snowplow_id: 'sp_NOAGE', id_type: 'DOMAIN_USERID', id_value: 'shared-x', first_app_id: 'web', last_app_id: 'web', first_seen_at: '2026-01-04 00:00:00.000', last_seen_at: '2026-01-06 00:00:00.000', first_seen_event_id: 'evt-nx'}
    expect:
