        - {active_snowplow_id: 'sp_TWO', id_type: 'domain_userid', id_value: 'user-linked', first_app_id: 'web', last_app_id: 'web', first_seen_at: '2025-12-18 10:00:00.000', last_seen_at: '2025-12-18 10:00:00.000', first_seen_event_id: 'evt-two', mapping_state: 'multiple', is_preferred: false}

  - name: test__snowplow_identities_identifier_mapping__unique_conflict_suppresses_merge_limited
    description: >
      One owner hit the cap and another holds a conflicting unique identifier. The two
      reasons describe incompatible situations, and a unique identifier is exactly the
      configuration under which collapsing an identifier onto one owner is unsafe, so the
      merge limit reason does not get to decide. The previous behaviour stands.
    model: snowplow_identities_identifier_mapping
    overrides:
      vars:
        snowplow__merge_limit_collapse: true
    given:
      - input: ref('snowplow_identities_identifier_mapping_base')
        rows:
          - {id_key: 'k_flagged', snowplow_id: 'sp_FLAGGED', id_type: 'domain_userid', id_value: 'user-linked', first_app_id: 'web', last_app_id: 'web', first_seen_at: '2025-12-17 10:00:00.000', last_seen_at: '2025-12-17 10:00:00.000', first_seen_event_id: 'evt-flagged', load_tstamp: '2025-12-19 11:00:00.000', decision_reasons: ['merge_limit_exceeded']}
          - {id_key: 'k_unique', snowplow_id: 'sp_UNIQUE', id_type: 'domain_userid', id_value: 'user-linked', first_app_id: 'web', last_app_id: 'web', first_seen_at: '2025-12-18 10:00:00.000', last_seen_at: '2025-12-19 10:00:00.000', first_seen_event_id: 'evt-unique', load_tstamp: '2025-12-19 11:00:00.000', decision_reasons: ['unique_identifier_conflict']}
      - input: ref('snowplow_identities_snowplow_id_mapping')
        rows: []
      - input: ref('snowplow_identities_identities')
        rows:
          - {snowplow_id: 'sp_FLAGGED', created_at: '2025-12-17 09:00:00.000'}
          - {snowplow_id: 'sp_UNIQUE', created_at: '2025-12-18 09:00:00.000'}
    expect:
      rows:
        - {active_snowplow_id: 'sp_FLAGGED', id_type: 'domain_userid', id_value: 'user-linked', first_app_id: 'web', last_app_id: 'web', first_seen_at: '2025-12-17 10:00:00.000', last_seen_at: '2025-12-17 10:00:00.000', first_seen_event_id: 'evt-flagged', mapping_state: 'multiple', is_preferred: false}
        - {active_snowplow_id: 'sp_UNIQUE', id_type: 'domain_userid', id_value: 'user-linked', first_app_id: 'web', last_app_id: 'web', first_seen_at: '2025-12-18 10:00:00.000', last_seen_at: '2025-12-19 10:00:00.000', first_seen_event_id: 'evt-unique', mapping_state: 'multiple', is_preferred: true}
