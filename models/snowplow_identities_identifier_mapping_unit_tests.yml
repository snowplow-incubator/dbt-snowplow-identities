  - name: test__snowplow_identities_identifier_mapping__two_merge_limited_owners_fall_back
    description: >
      Both owners carry the reason, so it no longer points at one of them and the models
      have nothing to choose by. The previous behaviour has to stand: the state stays
      multiple and the recency heuristic picks, exactly as it did before the reason existed.
    model: snowplow_identities_identifier_mapping
    overrides:
