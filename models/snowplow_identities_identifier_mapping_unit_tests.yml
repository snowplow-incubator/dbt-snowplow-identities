version: 2

unit_tests:

  - name: test__snowplow_identities_identifier_mapping__repoint_existing_on_merge
    description: >
      Regression test. In batch 1, sp_BBBB was created and its
      domain_userid=user-bbb was stored in the identifier_mapping table.
      In batch 2, sp_BBBB is merged into sp_AAAA but no new events arrive
      for sp_BBBB. The model must re-point the existing identifier row
      from active_snowplow_id=sp_BBBB to sp_AAAA.
    model: snowplow_identities_identifier_mapping
    overrides:
      macros:
        is_incremental: true
        snowplow_utils.is_run_with_new_events: "true"
    given:
      - input: ref('snowplow_identities_identifier_mapping_this_run')
        rows: []
      - input: ref('snowplow_identities_new_identities')
        rows: []
      - input: ref('snowplow_identities_snowplow_id_mapping_this_run')
        rows:
          - {snowplow_id: 'sp_BBBB', active_snowplow_id: 'sp_AAAA', merged_at: '2025-12-19 14:00:00.000', model_tstamp: '2025-12-19 14:05:00.000'}
      - input: ref('snowplow_identities_snowplow_id_mapping')
        rows:
          - {snowplow_id: 'sp_BBBB', active_snowplow_id: 'sp_AAAA', merged_at: '2025-12-19 14:00:00.000', model_tstamp: '2025-12-19 14:05:00.000'}
      - input: this
        rows:
          - {uuid: 'uuid-bbb', active_snowplow_id: 'sp_BBBB', id_type: 'DOMAIN_USERID', id_value: 'user-bbb', first_app_id: 'web', last_app_id: 'web', first_seen_at: '2025-12-18 10:00:00.000', last_seen_at: '2025-12-18 10:00:10.000', first_seen_event_id: 'evt-002'}
    expect:
      rows:
        - {active_snowplow_id: 'sp_AAAA', id_type: 'DOMAIN_USERID', id_value: 'user-bbb', first_app_id: 'web', last_app_id: 'web', first_seen_at: '2025-12-18 10:00:00.000', last_seen_at: '2025-12-18 10:00:10.000', first_seen_event_id: 'evt-002'}

  - name: test__snowplow_identities_identifier_mapping__repoint_multiple_parents_to_same_active
    description: >
      Regression test for the duplicate-uuid MERGE failure. During an
      identities-service incident one identifier (user-shared) was seen under
      several snowplow_ids (sp_CCCC and sp_DDDD), each stored as its own row in
      the identifier_mapping table. In a later batch both are merged into
      sp_AAAA with no new events for the identifier. Re-pointing resolves both
      historical rows to active_snowplow_id=sp_AAAA, giving them the same uuid.
      Without dedupe existing_to_repoint emits both, and the MERGE on
      unique_key=uuid rejects two source rows for one target. The model must
      collapse them into a single row spanning both rows' seen-at range.
    model: snowplow_identities_identifier_mapping
    overrides:
      macros:
        is_incremental: true
        snowplow_utils.is_run_with_new_events: "true"
    given:
      - input: ref('snowplow_identities_identifier_mapping_this_run')
        rows: []
      - input: ref('snowplow_identities_new_identities')
        rows: []
      - input: ref('snowplow_identities_snowplow_id_mapping_this_run')
        rows:
          - {snowplow_id: 'sp_CCCC', active_snowplow_id: 'sp_AAAA', merged_at: '2025-12-19 14:00:00.000', model_tstamp: '2025-12-19 14:05:00.000'}
          - {snowplow_id: 'sp_DDDD', active_snowplow_id: 'sp_AAAA', merged_at: '2025-12-19 14:00:00.000', model_tstamp: '2025-12-19 14:05:00.000'}
      - input: ref('snowplow_identities_snowplow_id_mapping')
        rows:
          - {snowplow_id: 'sp_CCCC', active_snowplow_id: 'sp_AAAA', merged_at: '2025-12-19 14:00:00.000', model_tstamp: '2025-12-19 14:05:00.000'}
          - {snowplow_id: 'sp_DDDD', active_snowplow_id: 'sp_AAAA', merged_at: '2025-12-19 14:00:00.000', model_tstamp: '2025-12-19 14:05:00.000'}
      - input: this
        rows:
          - {uuid: 'uuid-ccc', active_snowplow_id: 'sp_CCCC', id_type: 'DOMAIN_USERID', id_value: 'user-shared', first_app_id: 'web', last_app_id: 'web', first_seen_at: '2025-12-18 10:00:00.000', last_seen_at: '2025-12-18 10:00:10.000', first_seen_event_id: 'evt-ccc'}
          - {uuid: 'uuid-ddd', active_snowplow_id: 'sp_DDDD', id_type: 'DOMAIN_USERID', id_value: 'user-shared', first_app_id: 'mobile', last_app_id: 'mobile', first_seen_at: '2025-12-18 11:00:00.000', last_seen_at: '2025-12-18 11:00:20.000', first_seen_event_id: 'evt-ddd'}
    expect:
      rows:
        - {active_snowplow_id: 'sp_AAAA', id_type: 'DOMAIN_USERID', id_value: 'user-shared', first_app_id: 'web', last_app_id: 'mobile', first_seen_at: '2025-12-18 10:00:00.000', last_seen_at: '2025-12-18 11:00:20.000', first_seen_event_id: 'evt-ccc'}

  - name: test__snowplow_identities_identifier_mapping__merge_with_new_events_for_absorbed_identity
    description: >
      In batch 1, sp_BBBB was created with domain_userid=user-bbb.
      In batch 2, sp_BBBB merges into sp_AAAA and new events also
      arrive for sp_BBBB in the same batch (e.g. a page view tracked
      just before the merge). The identifier row should be updated
      from the new events (not duplicated by the re-pointing path),
      and correctly point to sp_AAAA.
    model: snowplow_identities_identifier_mapping
    overrides:
      macros:
        is_incremental: true
        snowplow_utils.is_run_with_new_events: "true"
    given:
      - input: ref('snowplow_identities_identifier_mapping_this_run')
        rows:
          - {uuid: 'uuid-bbb', active_snowplow_id: 'sp_AAAA', id_type: 'DOMAIN_USERID', id_value: 'user-bbb', first_app_id: 'web', last_app_id: 'web', first_seen_at: '2025-12-18 10:00:00.000', last_seen_at: '2025-12-19 14:00:00.000', first_seen_event_id: 'evt-new'}
      - input: ref('snowplow_identities_new_identities')
        rows: []
      - input: ref('snowplow_identities_snowplow_id_mapping_this_run')
        rows:
          - {snowplow_id: 'sp_BBBB', active_snowplow_id: 'sp_AAAA', merged_at: '2025-12-19 14:00:00.000', model_tstamp: '2025-12-19 14:05:00.000'}
      - input: ref('snowplow_identities_snowplow_id_mapping')
        rows:
          - {snowplow_id: 'sp_BBBB', active_snowplow_id: 'sp_AAAA', merged_at: '2025-12-19 14:00:00.000', model_tstamp: '2025-12-19 14:05:00.000'}
      - input: this
        rows:
          - {uuid: 'uuid-bbb', active_snowplow_id: 'sp_BBBB', id_type: 'DOMAIN_USERID', id_value: 'user-bbb', first_app_id: 'web', last_app_id: 'web', first_seen_at: '2025-12-18 10:00:00.000', last_seen_at: '2025-12-18 10:00:10.000', first_seen_event_id: 'evt-002'}
    expect:
      rows:
        - {active_snowplow_id: 'sp_AAAA', id_type: 'DOMAIN_USERID', id_value: 'user-bbb', first_app_id: 'web', last_app_id: 'web', first_seen_at: '2025-12-18 10:00:00.000', last_seen_at: '2025-12-19 14:00:00.000', first_seen_event_id: 'evt-002'}

  - name: test__snowplow_identities_identifier_mapping__preserve_first_seen_at
    description: >
      A user visits on Monday (first_seen_at=Monday, last_seen_at=Monday).
      The same identifier appears again on Wednesday in a new batch.
      The table should preserve first_seen_at=Monday and update
      last_seen_at=Wednesday.
    model: snowplow_identities_identifier_mapping
    overrides:
      macros:
        is_incremental: true
        snowplow_utils.is_run_with_new_events: "true"
    given:
      - input: ref('snowplow_identities_identifier_mapping_this_run')
        rows:
          - {uuid: 'uuid-aaa', active_snowplow_id: 'sp_AAAA', id_type: 'DOMAIN_USERID', id_value: 'user-aaa', first_app_id: 'web', last_app_id: 'web', first_seen_at: '2025-12-17 10:00:00.000', last_seen_at: '2025-12-19 14:00:00.000', first_seen_event_id: 'evt-wed'}
      - input: ref('snowplow_identities_new_identities')
        rows: []
      - input: ref('snowplow_identities_snowplow_id_mapping_this_run')
        rows: []
      - input: ref('snowplow_identities_snowplow_id_mapping')
        rows: []
      - input: this
        rows:
          - {uuid: 'uuid-aaa', active_snowplow_id: 'sp_AAAA', id_type: 'DOMAIN_USERID', id_value: 'user-aaa', first_app_id: 'web', last_app_id: 'web', first_seen_at: '2025-12-15 10:00:00.000', last_seen_at: '2025-12-15 10:00:00.000', first_seen_event_id: 'evt-mon'}
    expect:
      rows:
        - {active_snowplow_id: 'sp_AAAA', id_type: 'DOMAIN_USERID', id_value: 'user-aaa', first_app_id: 'web', last_app_id: 'web', first_seen_at: '2025-12-15 10:00:00.000', last_seen_at: '2025-12-19 14:00:00.000', first_seen_event_id: 'evt-mon'}

  - name: test__snowplow_identities_identifier_mapping__preserve_first_app_id
    description: >
      Bug: first_app_id is overwritten by the current batch instead of
      being preserved from the historical record. In batch 1, identifier
      user-aaa is first seen from app 'web'. In batch 2, the same
      identifier appears from app 'mobile'. The model should preserve
      first_app_id='web' from batch 1, but new_with_history uses
      c.first_app_id directly (='mobile') without checking which batch
      is earlier.
    model: snowplow_identities_identifier_mapping
    config:
      tags: ["snowflake_only"]
    overrides:
      macros:
        is_incremental: true
        snowplow_utils.is_run_with_new_events: "true"
    given:
      - input: ref('snowplow_identities_identifier_mapping_this_run')
        rows:
          - {uuid: 'uuid-aaa', active_snowplow_id: 'sp_AAAA', id_type: 'DOMAIN_USERID', id_value: 'user-aaa', first_app_id: 'mobile', last_app_id: 'mobile', first_seen_at: '2025-12-19 14:00:00.000', last_seen_at: '2025-12-19 14:00:00.000', first_seen_event_id: 'evt-wed'}
      - input: ref('snowplow_identities_new_identities')
        rows: []
      - input: ref('snowplow_identities_snowplow_id_mapping_this_run')
        rows: []
      - input: ref('snowplow_identities_snowplow_id_mapping')
        rows: []
      - input: this
        rows:
          - {uuid: 'uuid-aaa', active_snowplow_id: 'sp_AAAA', id_type: 'DOMAIN_USERID', id_value: 'user-aaa', first_app_id: 'web', last_app_id: 'web', first_seen_at: '2025-12-15 10:00:00.000', last_seen_at: '2025-12-15 10:00:00.000', first_seen_event_id: 'evt-mon'}
    expect:
      rows:
        - {active_snowplow_id: 'sp_AAAA', id_type: 'DOMAIN_USERID', id_value: 'user-aaa', first_app_id: 'web', last_app_id: 'mobile', first_seen_at: '2025-12-15 10:00:00.000', last_seen_at: '2025-12-19 14:00:00.000', first_seen_event_id: 'evt-mon'}

  - name: test__snowplow_identities_identifier_mapping__late_arriving_earlier_event
    description: >
      Bug: first_seen_event_id is not updated when a late-arriving event
      has an earlier timestamp. In batch 1, identifier user-aaa is first
      seen at 10:00 (evt-001). In batch 2, a late-arriving event (evt-early)
      with derived_tstamp 09:50 arrives. The first_seen_event_id should
      update to evt-early (chronologically earlier), but
      coalesce(h.first_seen_event_id, c.first_seen_event_id) always
      keeps the historical value when it exists.
    model: snowplow_identities_identifier_mapping
    config:
      tags: ["snowflake_only"]
    overrides:
      macros:
        is_incremental: true
        snowplow_utils.is_run_with_new_events: "true"
    given:
      - input: ref('snowplow_identities_identifier_mapping_this_run')
        rows:
          - {uuid: 'uuid-aaa', active_snowplow_id: 'sp_AAAA', id_type: 'DOMAIN_USERID', id_value: 'user-aaa', first_app_id: 'web', last_app_id: 'web', first_seen_at: '2025-12-18 09:50:00.000', last_seen_at: '2025-12-18 09:50:00.000', first_seen_event_id: 'evt-early'}
      - input: ref('snowplow_identities_new_identities')
        rows: []
      - input: ref('snowplow_identities_snowplow_id_mapping_this_run')
        rows: []
      - input: ref('snowplow_identities_snowplow_id_mapping')
        rows: []
      - input: this
        rows:
          - {uuid: 'uuid-aaa', active_snowplow_id: 'sp_AAAA', id_type: 'DOMAIN_USERID', id_value: 'user-aaa', first_app_id: 'web', last_app_id: 'web', first_seen_at: '2025-12-18 10:00:00.000', last_seen_at: '2025-12-18 10:00:00.000', first_seen_event_id: 'evt-001'}
    expect:
      rows:
        - {active_snowplow_id: 'sp_AAAA', id_type: 'DOMAIN_USERID', id_value: 'user-aaa', first_app_id: 'web', last_app_id: 'web', first_seen_at: '2025-12-18 09:50:00.000', last_seen_at: '2025-12-18 10:00:00.000', first_seen_event_id: 'evt-early'}

  - name: test__snowplow_identities_identifier_mapping__identical_sets_collapse_to_oldest_root
    description: >
      Merge limit collapse. sp_AAAA and sp_BBBB each have rows for shared-x and
      shared-z. The identity service always links into the identity with the
      earliest created_at. The model must choose the same way, by created_at
      from new_identities. sp_BBBB has the newer shared-z row. sp_AAAA was
      created first. So both identifiers move under sp_AAAA. The moved rows
      keep sp_BBBB's first_seen values. Choosing by newest event instead would
      put shared-x under one snowplow_id and shared-z under the other.
    model: snowplow_identities_identifier_mapping
    overrides:
      vars:
        snowplow__merge_limit_collapse: true
      macros:
        is_incremental: true
        snowplow_utils.is_run_with_new_events: "true"
    given:
      - input: ref('snowplow_identities_identifier_mapping_this_run')
        rows:
          - {uuid: 'uuid-ax', active_snowplow_id: 'sp_AAAA', id_type: 'DOMAIN_USERID', id_value: 'shared-x', first_app_id: 'web', last_app_id: 'web', first_seen_at: '2026-01-13 10:00:00.000', last_seen_at: '2026-01-13 10:00:00.000', first_seen_event_id: 'evt-ax2'}
          - {uuid: 'uuid-bz', active_snowplow_id: 'sp_BBBB', id_type: 'DOMAIN_USERID', id_value: 'shared-z', first_app_id: 'web', last_app_id: 'web', first_seen_at: '2026-01-13 11:00:00.000', last_seen_at: '2026-01-13 11:00:00.000', first_seen_event_id: 'evt-bz2'}
      - input: ref('snowplow_identities_snowplow_id_mapping_this_run')
        rows: []
      - input: ref('snowplow_identities_snowplow_id_mapping')
        rows: []
      - input: ref('snowplow_identities_new_identities')
        rows:
          - {snowplow_id: 'sp_AAAA', created_at: '2026-01-01 00:00:00.000'}
          - {snowplow_id: 'sp_BBBB', created_at: '2026-01-02 00:00:00.000'}
      - input: this
        rows:
          - {uuid: 'uuid-ax', active_snowplow_id: 'sp_AAAA', id_type: 'DOMAIN_USERID', id_value: 'shared-x', first_app_id: 'web', last_app_id: 'web', first_seen_at: '2026-01-01 00:00:00.000', last_seen_at: '2026-01-10 00:00:00.000', first_seen_event_id: 'evt-ax'}
          - {uuid: 'uuid-az', active_snowplow_id: 'sp_AAAA', id_type: 'DOMAIN_USERID', id_value: 'shared-z', first_app_id: 'web', last_app_id: 'web', first_seen_at: '2026-01-01 00:00:00.000', last_seen_at: '2026-01-05 00:00:00.000', first_seen_event_id: 'evt-az'}
          - {uuid: 'uuid-bx', active_snowplow_id: 'sp_BBBB', id_type: 'DOMAIN_USERID', id_value: 'shared-x', first_app_id: 'web', last_app_id: 'web', first_seen_at: '2026-01-02 00:00:00.000', last_seen_at: '2026-01-08 00:00:00.000', first_seen_event_id: 'evt-bx'}
          - {uuid: 'uuid-bz', active_snowplow_id: 'sp_BBBB', id_type: 'DOMAIN_USERID', id_value: 'shared-z', first_app_id: 'web', last_app_id: 'web', first_seen_at: '2026-01-02 00:00:00.000', last_seen_at: '2026-01-12 00:00:00.000', first_seen_event_id: 'evt-bz'}
    expect:
      rows:
        - {active_snowplow_id: 'sp_AAAA', id_type: 'DOMAIN_USERID', id_value: 'shared-x', first_app_id: 'web', last_app_id: 'web', first_seen_at: '2026-01-01 00:00:00.000', last_seen_at: '2026-01-13 10:00:00.000', first_seen_event_id: 'evt-ax'}
        - {active_snowplow_id: 'sp_AAAA', id_type: 'DOMAIN_USERID', id_value: 'shared-z', first_app_id: 'web', last_app_id: 'web', first_seen_at: '2026-01-01 00:00:00.000', last_seen_at: '2026-01-13 11:00:00.000', first_seen_event_id: 'evt-az'}

  - name: test__snowplow_identities_identifier_mapping__unknown_age_root_never_absorbed
    description: >
      Merge limit collapse. sp_NOAGE has a row for shared-x but no row in
      new_identities. That happens when an identity was created before the
      model's start date, or was only ever named by merge events, which carry
      no identity context. Its created_at is unknown. Nothing proves it is
      younger than sp_KNOWN. The identity service may still resolve shared-x
      to it. So the rule is: if any snowplow_id with a row for an identifier
      has no created_at, no row for that identifier moves and no row is
      deleted. Sorting unknowns last would move sp_NOAGE's row under the
      younger sp_KNOWN and delete the wrong row.
    model: snowplow_identities_identifier_mapping
    overrides:
      vars:
        snowplow__merge_limit_collapse: true
      macros:
        is_incremental: true
        snowplow_utils.is_run_with_new_events: "true"
    given:
      - input: ref('snowplow_identities_identifier_mapping_this_run')
        rows:
          - {uuid: 'uuid-kx', active_snowplow_id: 'sp_KNOWN', id_type: 'DOMAIN_USERID', id_value: 'shared-x', first_app_id: 'web', last_app_id: 'web', first_seen_at: '2026-01-13 10:00:00.000', last_seen_at: '2026-01-13 10:00:00.000', first_seen_event_id: 'evt-kx2'}
      - input: ref('snowplow_identities_snowplow_id_mapping_this_run')
        rows: []
      - input: ref('snowplow_identities_snowplow_id_mapping')
        rows: []
      - input: ref('snowplow_identities_new_identities')
        rows:
          - {snowplow_id: 'sp_KNOWN', created_at: '2026-01-05 00:00:00.000'}
      - input: this
        rows:
          - {uuid: 'uuid-nx', active_snowplow_id: 'sp_NOAGE', id_type: 'DOMAIN_USERID', id_value: 'shared-x', first_app_id: 'web', last_app_id: 'web', first_seen_at: '2026-01-01 00:00:00.000', last_seen_at: '2026-01-02 00:00:00.000', first_seen_event_id: 'evt-nx'}
          - {uuid: 'uuid-kx', active_snowplow_id: 'sp_KNOWN', id_type: 'DOMAIN_USERID', id_value: 'shared-x', first_app_id: 'web', last_app_id: 'web', first_seen_at: '2026-01-06 00:00:00.000', last_seen_at: '2026-01-10 00:00:00.000', first_seen_event_id: 'evt-kx'}
          - {uuid: 'uuid-ky', active_snowplow_id: 'sp_KNOWN', id_type: 'DOMAIN_USERID', id_value: 'other-y', first_app_id: 'web', last_app_id: 'web', first_seen_at: '2026-01-06 00:00:00.000', last_seen_at: '2026-01-10 00:00:00.000', first_seen_event_id: 'evt-ky'}
    expect:
      rows:
        # sp_NOAGE's untouched history row stays in the table but is no longer
        # re-emitted by the model: unchanged partitions are excluded from the
        # MERGE source.
        - {active_snowplow_id: 'sp_KNOWN', id_type: 'DOMAIN_USERID', id_value: 'shared-x', first_app_id: 'web', last_app_id: 'web', first_seen_at: '2026-01-06 00:00:00.000', last_seen_at: '2026-01-13 10:00:00.000', first_seen_event_id: 'evt-kx'}

  - name: test__snowplow_identities_identifier_mapping__unknown_age_holder_blocks_absorption
    description: >
      Merge limit collapse. Three snowplow_ids have rows for shared-x.
      sp_UNKNOWN has no row in new_identities. sp_KNOWN was created 01-05.
      sp_SUB was created 01-06. sp_UNKNOWN may be the oldest of the three, and
      the one the identity service links into. Moving sp_SUB's row under
      sp_KNOWN would then be wrong, because the service may resolve shared-x
      to sp_UNKNOWN, not sp_KNOWN. So one undated snowplow_id freezes the whole
      identifier: no row for shared-x moves and no row is deleted. The model
      also emits nothing for rows it did not change.
    model: snowplow_identities_identifier_mapping
    overrides:
      vars:
        snowplow__merge_limit_collapse: true
      macros:
        is_incremental: true
        snowplow_utils.is_run_with_new_events: "true"
    given:
      - input: ref('snowplow_identities_identifier_mapping_this_run')
        rows:
          - {uuid: 'uuid-kx', active_snowplow_id: 'sp_KNOWN', id_type: 'DOMAIN_USERID', id_value: 'shared-x', first_app_id: 'web', last_app_id: 'web', first_seen_at: '2026-01-13 10:00:00.000', last_seen_at: '2026-01-13 10:00:00.000', first_seen_event_id: 'evt-kx2'}
      - input: ref('snowplow_identities_snowplow_id_mapping_this_run')
        rows: []
      - input: ref('snowplow_identities_snowplow_id_mapping')
        rows: []
      - input: ref('snowplow_identities_new_identities')
        rows:
          - {snowplow_id: 'sp_KNOWN', created_at: '2026-01-05 00:00:00.000'}
          - {snowplow_id: 'sp_SUB', created_at: '2026-01-06 00:00:00.000'}
      - input: this
        rows:
          - {uuid: 'uuid-ux', active_snowplow_id: 'sp_UNKNOWN', id_type: 'DOMAIN_USERID', id_value: 'shared-x', first_app_id: 'web', last_app_id: 'web', first_seen_at: '2026-01-01 00:00:00.000', last_seen_at: '2026-01-02 00:00:00.000', first_seen_event_id: 'evt-ux'}
