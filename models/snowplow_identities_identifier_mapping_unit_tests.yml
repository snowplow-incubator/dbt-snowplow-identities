        - {active_snowplow_id: 'sp_UNIQUE', id_type: 'domain_userid', id_value: 'user-linked', first_app_id: 'web', last_app_id: 'web', first_seen_at: '2025-12-18 10:00:00.000', last_seen_at: '2025-12-19 10:00:00.000', first_seen_event_id: 'evt-unique', mapping_state: 'multiple', is_preferred: true}

