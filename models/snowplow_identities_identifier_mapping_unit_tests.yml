version: 2

# These are the re-pointing regression scenarios that previously lived against the
# incremental identifier_mapping table. They now target the view, because resolution
# moved to read time -- the behaviour under test is unchanged, the layer that owns it
# is not. Each one used to require rewriting or deleting stored rows; none of them
# writes anything now.
#
# identities is mocked because mapping_state ranks an identifier's owners by their
# created_at. Single-owner cases never read it, so their fixture is empty.

unit_tests:

  - name: test__snowplow_identities_identifier_mapping__resolves_merged_child_to_parent
    description: >
      sp_BBBB's domain_userid=user-bbb was stored under sp_BBBB. sp_BBBB has since
      merged into sp_AAAA and no new events have arrived for it. The view must report
      active_snowplow_id=sp_AAAA without the base row ever being rewritten.
    model: snowplow_identities_identifier_mapping
    given:
      - input: ref('snowplow_identities_identifier_mapping_base')
        rows:
          - {id_key: 'k_bbb', snowplow_id: 'sp_BBBB', id_type: 'domain_userid', id_value: 'user-bbb', first_app_id: 'web', last_app_id: 'web', first_seen_at: '2025-12-17 10:00:00.000', last_seen_at: '2025-12-17 10:00:10.000', first_seen_event_id: 'evt-001', load_tstamp: '2025-12-18 11:00:00.000'}
      - input: ref('snowplow_identities_snowplow_id_mapping')
        rows:
          - {snowplow_id: 'sp_BBBB', active_snowplow_id: 'sp_AAAA', merged_at: '2025-12-18 10:02:00.000', model_tstamp: '2025-12-18 10:05:00.000'}
      - input: ref('snowplow_identities_identities')
        rows: []
    # uuid is omitted: surrogate key (non-deterministic hash)
    expect:
      rows:
        - {active_snowplow_id: 'sp_AAAA', id_type: 'domain_userid', id_value: 'user-bbb', first_app_id: 'web', last_app_id: 'web', first_seen_at: '2025-12-17 10:00:00.000', last_seen_at: '2025-12-17 10:00:10.000', first_seen_event_id: 'evt-001', mapping_state: 'single', is_preferred: true}

  - name: test__snowplow_identities_identifier_mapping__collapses_multiple_parents_to_one_row
    description: >
      Regression test for the duplicate-uuid MERGE failure. During an identities-service
      incident one identifier (user-shared) was seen under several snowplow_ids
      (sp_CCCC and sp_DDDD), each its own immutable base row. Both have since merged
      into sp_AAAA. The view must collapse them into a single row spanning both
      seen-at ranges, taking first_app_id and first_seen_event_id from the earlier row.
      Previously this needed a dedupe before the MERGE; here it is just aggregation.
    model: snowplow_identities_identifier_mapping
    given:
      - input: ref('snowplow_identities_identifier_mapping_base')
        rows:
          - {id_key: 'k_ccc', snowplow_id: 'sp_CCCC', id_type: 'domain_userid', id_value: 'user-shared', first_app_id: 'web', last_app_id: 'web', first_seen_at: '2025-12-17 09:00:00.000', last_seen_at: '2025-12-17 09:00:10.000', first_seen_event_id: 'evt-ccc', load_tstamp: '2025-12-18 11:00:00.000'}
          - {id_key: 'k_ddd', snowplow_id: 'sp_DDDD', id_type: 'domain_userid', id_value: 'user-shared', first_app_id: 'mobile', last_app_id: 'mobile', first_seen_at: '2025-12-17 11:00:00.000', last_seen_at: '2025-12-17 11:00:10.000', first_seen_event_id: 'evt-ddd', load_tstamp: '2025-12-18 11:00:00.000'}
      - input: ref('snowplow_identities_snowplow_id_mapping')
        rows:
          - {snowplow_id: 'sp_CCCC', active_snowplow_id: 'sp_AAAA', merged_at: '2025-12-18 10:02:00.000', model_tstamp: '2025-12-18 10:05:00.000'}
          - {snowplow_id: 'sp_DDDD', active_snowplow_id: 'sp_AAAA', merged_at: '2025-12-18 10:02:00.000', model_tstamp: '2025-12-18 10:05:00.000'}
      - input: ref('snowplow_identities_identities')
        rows: []
    expect:
      rows:
        - {active_snowplow_id: 'sp_AAAA', id_type: 'domain_userid', id_value: 'user-shared', first_app_id: 'web', last_app_id: 'mobile', first_seen_at: '2025-12-17 09:00:00.000', last_seen_at: '2025-12-17 11:00:10.000', first_seen_event_id: 'evt-ccc', mapping_state: 'single', is_preferred: true}

  - name: test__snowplow_identities_identifier_mapping__unmerged_id_resolves_to_itself
    description: >
      An identity that has never been merged has no row in snowplow_id_mapping, so the
      view must fall back to its own snowplow_id rather than dropping the row.
    model: snowplow_identities_identifier_mapping
    given:
      - input: ref('snowplow_identities_identifier_mapping_base')
        rows:
          - {id_key: 'k_aaa', snowplow_id: 'sp_AAAA', id_type: 'user_id', id_value: 'john@example.com', first_app_id: 'web', last_app_id: 'web', first_seen_at: '2025-12-18 10:00:00.000', last_seen_at: '2025-12-18 10:00:10.000', first_seen_event_id: 'evt-001', load_tstamp: '2025-12-18 11:00:00.000'}
      - input: ref('snowplow_identities_snowplow_id_mapping')
        rows: []
      - input: ref('snowplow_identities_identities')
        rows: []
    expect:
      rows:
        - {active_snowplow_id: 'sp_AAAA', id_type: 'user_id', id_value: 'john@example.com', first_app_id: 'web', last_app_id: 'web', first_seen_at: '2025-12-18 10:00:00.000', last_seen_at: '2025-12-18 10:00:10.000', first_seen_event_id: 'evt-001', mapping_state: 'single', is_preferred: true}

  - name: test__snowplow_identities_identifier_mapping__cascading_merge_resolves_to_final_root
    description: >
      A cascading merge: sp_CCCC merged into sp_BBBB, then that group merged into
      sp_AAAA. snowplow_id_mapping re-points both children at the final root, so the
      view's single-hop join lands on sp_AAAA for both. This is the scenario that
      previously left stale rows behind and needed the _affected snapshot to fix.
    model: snowplow_identities_identifier_mapping
    given:
      - input: ref('snowplow_identities_identifier_mapping_base')
        rows:
          - {id_key: 'k_bbb', snowplow_id: 'sp_BBBB', id_type: 'domain_userid', id_value: 'user-bbb', first_app_id: 'web', last_app_id: 'web', first_seen_at: '2025-12-17 10:00:00.000', last_seen_at: '2025-12-17 10:00:10.000', first_seen_event_id: 'evt-bbb', load_tstamp: '2025-12-18 11:00:00.000'}
          - {id_key: 'k_ccc', snowplow_id: 'sp_CCCC', id_type: 'domain_userid', id_value: 'user-ccc', first_app_id: 'web', last_app_id: 'web', first_seen_at: '2025-12-17 11:00:00.000', last_seen_at: '2025-12-17 11:00:10.000', first_seen_event_id: 'evt-ccc', load_tstamp: '2025-12-18 11:00:00.000'}
      - input: ref('snowplow_identities_snowplow_id_mapping')
        rows:
          - {snowplow_id: 'sp_BBBB', active_snowplow_id: 'sp_AAAA', merged_at: '2025-12-18 10:02:00.000', model_tstamp: '2025-12-18 10:05:00.000'}
          - {snowplow_id: 'sp_CCCC', active_snowplow_id: 'sp_AAAA', merged_at: '2025-12-18 10:02:00.000', model_tstamp: '2025-12-18 10:05:00.000'}
      - input: ref('snowplow_identities_identities')
        rows: []
    expect:
      rows:
        - {active_snowplow_id: 'sp_AAAA', id_type: 'domain_userid', id_value: 'user-bbb', first_app_id: 'web', last_app_id: 'web', first_seen_at: '2025-12-17 10:00:00.000', last_seen_at: '2025-12-17 10:00:10.000', first_seen_event_id: 'evt-bbb', mapping_state: 'single', is_preferred: true}
        - {active_snowplow_id: 'sp_AAAA', id_type: 'domain_userid', id_value: 'user-ccc', first_app_id: 'web', last_app_id: 'web', first_seen_at: '2025-12-17 11:00:00.000', last_seen_at: '2025-12-17 11:00:10.000', first_seen_event_id: 'evt-ccc', mapping_state: 'single', is_preferred: true}

  - name: test__snowplow_identities_identifier_mapping__identifier_reused_by_new_identity
    description: >
      TTL behaviour the old grain could not represent. user-recycled expired from the
      engine under sp_OLD and later reappeared under sp_NEW, which has not merged with
      sp_OLD. Both base rows survive and the view reports two distinct owners rather
      than silently overwriting the first. sp_NEW holds the later sighting, so it is the
      preferred row.
    model: snowplow_identities_identifier_mapping
    overrides:
      vars:
        snowplow__merge_limit_collapse: true
    given:
      - input: ref('snowplow_identities_identifier_mapping_base')
        rows:
          - {id_key: 'k_old', snowplow_id: 'sp_OLD', id_type: 'domain_userid', id_value: 'user-recycled', first_app_id: 'web', last_app_id: 'web', first_seen_at: '2025-01-01 10:00:00.000', last_seen_at: '2025-01-01 10:00:10.000', first_seen_event_id: 'evt-old', load_tstamp: '2025-12-18 11:00:00.000'}
          - {id_key: 'k_new', snowplow_id: 'sp_NEW', id_type: 'domain_userid', id_value: 'user-recycled', first_app_id: 'web', last_app_id: 'web', first_seen_at: '2025-12-01 10:00:00.000', last_seen_at: '2025-12-01 10:00:10.000', first_seen_event_id: 'evt-new', load_tstamp: '2025-12-18 11:00:00.000'}
      - input: ref('snowplow_identities_snowplow_id_mapping')
        rows: []
      - input: ref('snowplow_identities_identities')
        rows:
          - {snowplow_id: 'sp_OLD', created_at: '2025-01-01 09:00:00.000'}
          - {snowplow_id: 'sp_NEW', created_at: '2025-12-01 09:00:00.000'}
    expect:
      rows:
        - {active_snowplow_id: 'sp_OLD', id_type: 'domain_userid', id_value: 'user-recycled', first_app_id: 'web', last_app_id: 'web', first_seen_at: '2025-01-01 10:00:00.000', last_seen_at: '2025-01-01 10:00:10.000', first_seen_event_id: 'evt-old', mapping_state: 'multiple', is_preferred: false}
        - {active_snowplow_id: 'sp_NEW', id_type: 'domain_userid', id_value: 'user-recycled', first_app_id: 'web', last_app_id: 'web', first_seen_at: '2025-12-01 10:00:00.000', last_seen_at: '2025-12-01 10:00:10.000', first_seen_event_id: 'evt-new', mapping_state: 'multiple', is_preferred: true}

  - name: test__snowplow_identities_identifier_mapping__merge_limit_link_prefers_oldest_owner
    description: >
      The merge limit shape. The engine refused to merge sp_YOUNG into sp_OLDEST and
      linked instead, so no merge event exists and user-linked sits under both. sp_OLDEST
      is the older identity and still holds the later sighting, so with the var on it is
      the preferred row and sp_YOUNG is not.
    model: snowplow_identities_identifier_mapping
    overrides:
      vars:
        snowplow__merge_limit_collapse: true
    given:
      - input: ref('snowplow_identities_identifier_mapping_base')
        rows:
          - {id_key: 'k_oldest', snowplow_id: 'sp_OLDEST', id_type: 'domain_userid', id_value: 'user-linked', first_app_id: 'web', last_app_id: 'web', first_seen_at: '2025-12-17 10:00:00.000', last_seen_at: '2025-12-19 10:00:00.000', first_seen_event_id: 'evt-oldest', load_tstamp: '2025-12-19 11:00:00.000'}
          - {id_key: 'k_young', snowplow_id: 'sp_YOUNG', id_type: 'domain_userid', id_value: 'user-linked', first_app_id: 'web', last_app_id: 'web', first_seen_at: '2025-12-18 10:00:00.000', last_seen_at: '2025-12-18 10:00:00.000', first_seen_event_id: 'evt-young', load_tstamp: '2025-12-19 11:00:00.000'}
      - input: ref('snowplow_identities_snowplow_id_mapping')
        rows: []
      - input: ref('snowplow_identities_identities')
        rows:
          - {snowplow_id: 'sp_OLDEST', created_at: '2025-12-17 09:00:00.000'}
          - {snowplow_id: 'sp_YOUNG', created_at: '2025-12-18 09:00:00.000'}
    expect:
      rows:
        - {active_snowplow_id: 'sp_OLDEST', id_type: 'domain_userid', id_value: 'user-linked', first_app_id: 'web', last_app_id: 'web', first_seen_at: '2025-12-17 10:00:00.000', last_seen_at: '2025-12-19 10:00:00.000', first_seen_event_id: 'evt-oldest', mapping_state: 'multiple', is_preferred: true}
        - {active_snowplow_id: 'sp_YOUNG', id_type: 'domain_userid', id_value: 'user-linked', first_app_id: 'web', last_app_id: 'web', first_seen_at: '2025-12-18 10:00:00.000', last_seen_at: '2025-12-18 10:00:00.000', first_seen_event_id: 'evt-young', mapping_state: 'multiple', is_preferred: false}

  - name: test__snowplow_identities_identifier_mapping__merge_limit_link_prefers_nothing_by_default
    description: >
      The same merge limit shape with the var left at its default. mapping_state still
      reports multiple, but neither row is preferred, because ranking an identifier's
      owners is only safe when no identifier is configured as unique in the identity
      service and only the operator knows that.
    model: snowplow_identities_identifier_mapping
    given:
      - input: ref('snowplow_identities_identifier_mapping_base')
        rows:
          - {id_key: 'k_oldest', snowplow_id: 'sp_OLDEST', id_type: 'domain_userid', id_value: 'user-linked', first_app_id: 'web', last_app_id: 'web', first_seen_at: '2025-12-17 10:00:00.000', last_seen_at: '2025-12-19 10:00:00.000', first_seen_event_id: 'evt-oldest', load_tstamp: '2025-12-19 11:00:00.000'}
          - {id_key: 'k_young', snowplow_id: 'sp_YOUNG', id_type: 'domain_userid', id_value: 'user-linked', first_app_id: 'web', last_app_id: 'web', first_seen_at: '2025-12-18 10:00:00.000', last_seen_at: '2025-12-18 10:00:00.000', first_seen_event_id: 'evt-young', load_tstamp: '2025-12-19 11:00:00.000'}
      - input: ref('snowplow_identities_snowplow_id_mapping')
        rows: []
      - input: ref('snowplow_identities_identities')
        rows:
          - {snowplow_id: 'sp_OLDEST', created_at: '2025-12-17 09:00:00.000'}
          - {snowplow_id: 'sp_YOUNG', created_at: '2025-12-18 09:00:00.000'}
    expect:
      rows:
        - {active_snowplow_id: 'sp_OLDEST', id_type: 'domain_userid', id_value: 'user-linked', first_app_id: 'web', last_app_id: 'web', first_seen_at: '2025-12-17 10:00:00.000', last_seen_at: '2025-12-19 10:00:00.000', first_seen_event_id: 'evt-oldest', mapping_state: 'multiple', is_preferred: false}
        - {active_snowplow_id: 'sp_YOUNG', id_type: 'domain_userid', id_value: 'user-linked', first_app_id: 'web', last_app_id: 'web', first_seen_at: '2025-12-18 10:00:00.000', last_seen_at: '2025-12-18 10:00:00.000', first_seen_event_id: 'evt-young', mapping_state: 'multiple', is_preferred: false}

  - name: test__snowplow_identities_identifier_mapping__undated_owner_is_unranked
    description: >
      One of the two owners has no row in identities, so its created_at is unknown and
      the owners cannot be ordered. mapping_state reports unranked and neither row is
      preferred even with the var on.
    model: snowplow_identities_identifier_mapping
    overrides:
      vars:
        snowplow__merge_limit_collapse: true
    given:
      - input: ref('snowplow_identities_identifier_mapping_base')
        rows:
          - {id_key: 'k_dated', snowplow_id: 'sp_DATED', id_type: 'domain_userid', id_value: 'user-partial', first_app_id: 'web', last_app_id: 'web', first_seen_at: '2025-12-17 10:00:00.000', last_seen_at: '2025-12-19 10:00:00.000', first_seen_event_id: 'evt-dated', load_tstamp: '2025-12-19 11:00:00.000'}
          - {id_key: 'k_undated', snowplow_id: 'sp_UNDATED', id_type: 'domain_userid', id_value: 'user-partial', first_app_id: 'web', last_app_id: 'web', first_seen_at: '2025-12-18 10:00:00.000', last_seen_at: '2025-12-18 10:00:00.000', first_seen_event_id: 'evt-undated', load_tstamp: '2025-12-19 11:00:00.000'}
      - input: ref('snowplow_identities_snowplow_id_mapping')
        rows: []
      - input: ref('snowplow_identities_identities')
        rows:
          - {snowplow_id: 'sp_DATED', created_at: '2025-12-17 09:00:00.000'}
    expect:
      rows:
        - {active_snowplow_id: 'sp_DATED', id_type: 'domain_userid', id_value: 'user-partial', first_app_id: 'web', last_app_id: 'web', first_seen_at: '2025-12-17 10:00:00.000', last_seen_at: '2025-12-19 10:00:00.000', first_seen_event_id: 'evt-dated', mapping_state: 'unranked', is_preferred: false}
        - {active_snowplow_id: 'sp_UNDATED', id_type: 'domain_userid', id_value: 'user-partial', first_app_id: 'web', last_app_id: 'web', first_seen_at: '2025-12-18 10:00:00.000', last_seen_at: '2025-12-18 10:00:00.000', first_seen_event_id: 'evt-undated', mapping_state: 'unranked', is_preferred: false}

  - name: test__snowplow_identities_identifier_mapping__full_tie_is_unranked
    description: >
      Two owners share both last_seen_at and created_at, so there is nothing to choose
      between them. The heuristic refuses rather than picking one by snowplow_id, even
      with the var on.
    model: snowplow_identities_identifier_mapping
    overrides:
      vars:
        snowplow__merge_limit_collapse: true
    given:
      - input: ref('snowplow_identities_identifier_mapping_base')
        rows:
          - {id_key: 'k_one', snowplow_id: 'sp_ONE', id_type: 'domain_userid', id_value: 'user-tied', first_app_id: 'web', last_app_id: 'web', first_seen_at: '2025-12-18 10:00:00.000', last_seen_at: '2025-12-18 10:00:00.000', first_seen_event_id: 'evt-one', load_tstamp: '2025-12-19 11:00:00.000'}
          - {id_key: 'k_two', snowplow_id: 'sp_TWO', id_type: 'domain_userid', id_value: 'user-tied', first_app_id: 'web', last_app_id: 'web', first_seen_at: '2025-12-18 10:00:00.000', last_seen_at: '2025-12-18 10:00:00.000', first_seen_event_id: 'evt-two', load_tstamp: '2025-12-19 11:00:00.000'}
      - input: ref('snowplow_identities_snowplow_id_mapping')
        rows: []
      - input: ref('snowplow_identities_identities')
        rows:
          - {snowplow_id: 'sp_ONE', created_at: '2025-12-18 09:00:00.000'}
          - {snowplow_id: 'sp_TWO', created_at: '2025-12-18 09:00:00.000'}
    expect:
      rows:
        - {active_snowplow_id: 'sp_ONE', id_type: 'domain_userid', id_value: 'user-tied', first_app_id: 'web', last_app_id: 'web', first_seen_at: '2025-12-18 10:00:00.000', last_seen_at: '2025-12-18 10:00:00.000', first_seen_event_id: 'evt-one', mapping_state: 'unranked', is_preferred: false}
        - {active_snowplow_id: 'sp_TWO', id_type: 'domain_userid', id_value: 'user-tied', first_app_id: 'web', last_app_id: 'web', first_seen_at: '2025-12-18 10:00:00.000', last_seen_at: '2025-12-18 10:00:00.000', first_seen_event_id: 'evt-two', mapping_state: 'unranked', is_preferred: false}

  # The cases below carry decision_reasons, an array. A yaml list renders as a
  # square-bracket array literal, which every supported warehouse parses. The ones
  # exercising the recency heuristic run with snowplow__merge_limit_collapse on, because
  # that is the only setting under which it picks a row and so the only one where a rule
  # overriding it, or failing to, is visible. The ones exercising the label run with the
  # default, because a reason acts whether or not the operator opted into the heuristic.

  - name: test__snowplow_identities_identifier_mapping__merge_limited_owner_beats_recency
    description: >
      The service refused the merge and linked user-linked to sp_FLAGGED, recording the
      reason on its rows. sp_RECENT holds the later sighting, so recency alone would pick
      it. The reason says which identity the service resolved to, which is an answer where
      recency is only a guess, so sp_FLAGGED is preferred and the state names the cause.
    model: snowplow_identities_identifier_mapping
    overrides:
      vars:
        snowplow__merge_limit_collapse: true
    given:
      - input: ref('snowplow_identities_identifier_mapping_base')
        rows:
          - {id_key: 'k_flagged', snowplow_id: 'sp_FLAGGED', id_type: 'domain_userid', id_value: 'user-linked', first_app_id: 'web', last_app_id: 'web', first_seen_at: '2025-12-17 10:00:00.000', last_seen_at: '2025-12-17 10:00:00.000', first_seen_event_id: 'evt-flagged', load_tstamp: '2025-12-19 11:00:00.000', decision_reasons: ['merge_limit_exceeded']}
          - {id_key: 'k_recent', snowplow_id: 'sp_RECENT', id_type: 'domain_userid', id_value: 'user-linked', first_app_id: 'web', last_app_id: 'web', first_seen_at: '2025-12-18 10:00:00.000', last_seen_at: '2025-12-19 10:00:00.000', first_seen_event_id: 'evt-recent', load_tstamp: '2025-12-19 11:00:00.000', decision_reasons: []}
      - input: ref('snowplow_identities_snowplow_id_mapping')
        rows: []
      - input: ref('snowplow_identities_identities')
        rows:
          - {snowplow_id: 'sp_FLAGGED', created_at: '2025-12-17 09:00:00.000'}
          - {snowplow_id: 'sp_RECENT', created_at: '2025-12-18 09:00:00.000'}
    expect:
      rows:
        - {active_snowplow_id: 'sp_FLAGGED', id_type: 'domain_userid', id_value: 'user-linked', first_app_id: 'web', last_app_id: 'web', first_seen_at: '2025-12-17 10:00:00.000', last_seen_at: '2025-12-17 10:00:00.000', first_seen_event_id: 'evt-flagged', mapping_state: 'merge_limited', is_preferred: true}
