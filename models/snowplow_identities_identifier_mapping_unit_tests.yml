        rows:
          - {snowplow_id: 'sp_OLD', created_at: '2025-12-01 09:00:00.000'}
          - {snowplow_id: 'sp_YOUNG', created_at: '2025-12-18 09:00:00.000'}
    expect:
      rows:
        - {active_snowplow_id: 'sp_OLD', id_type: 'domain_userid', id_value: 'user-linked', first_app_id: 'web', last_app_id: 'web', first_seen_at: '2025-12-18 12:00:00.000', last_seen_at: '2025-12-18 12:00:00.000', first_seen_event_id: 'evt-old', mapping_state: 'merge_limited', is_preferred: true}
        - {active_snowplow_id: 'sp_YOUNG', id_type: 'domain_userid', id_value: 'user-linked', first_app_id: 'web', last_app_id: 'web', first_seen_at: '2025-12-18 10:00:00.000', last_seen_at: '2025-12-19 10:00:00.000', first_seen_event_id: 'evt-young', mapping_state: 'merge_limited', is_preferred: false}

