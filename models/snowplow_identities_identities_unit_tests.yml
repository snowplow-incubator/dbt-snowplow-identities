version: 2

# These now drive off stg_identity_events rather than the deleted _this_run scratch model,
# so the first/last-event selection and the cross-run fold are exercised together.

unit_tests:

  - name: test__snowplow_identities_identities__first_last_across_apps
    description: >
      Three events for sp_AAAA at different times across two apps. first_* must come from
      the earliest event and last_* from the latest, and load_tstamp must be the newest
      seen -- not the one attached to the first or last event -- since the model's own
      watermark advances off it.
    model: snowplow_identities_identities
    config:
      tags: ["snowflake_only"]
    overrides:
      macros:
        is_incremental: false
      vars:
        snowplow__start_date: '2025-12-01'
        snowplow__backfill_limit_days: 90
    given:
      - input: ref('snowplow_identities_stg_identity_events')
        rows:
          - {snowplow_id: 'sp_AAAA', created_at: '2025-12-18 10:00:00.500', event_id: 'evt-010', app_id: 'web', derived_tstamp: '2025-12-18 10:00:00.000', collector_tstamp: '2025-12-18 10:00:00.100', load_tstamp: '2025-12-18 11:00:00.000'}
          - {snowplow_id: 'sp_AAAA', created_at: '2025-12-18 10:00:00.500', event_id: 'evt-011', app_id: 'web', derived_tstamp: '2025-12-18 10:05:00.000', collector_tstamp: '2025-12-18 10:05:00.100', load_tstamp: '2025-12-18 13:00:00.000'}
          - {snowplow_id: 'sp_AAAA', created_at: '2025-12-18 10:00:00.500', event_id: 'evt-012', app_id: 'ios', derived_tstamp: '2025-12-18 10:10:00.000', collector_tstamp: '2025-12-18 10:10:00.100', load_tstamp: '2025-12-18 12:00:00.000'}
    expect:
      rows:
        - {snowplow_id: 'sp_AAAA', created_at: '2025-12-18 10:00:00.500', first_seen_event_id: 'evt-010', first_app_id: 'web', last_app_id: 'ios', first_derived_tstamp: '2025-12-18 10:00:00.000', last_derived_tstamp: '2025-12-18 10:10:00.000', load_tstamp: '2025-12-18 13:00:00.000'}

  - name: test__snowplow_identities_identities__two_users_created
    description: >
      Two events create sp_AAAA and sp_BBBB. Expects one row per identity.
    model: snowplow_identities_identities
    config:
      tags: ["snowflake_only"]
    overrides:
      macros:
        is_incremental: false
      vars:
        snowplow__start_date: '2025-12-01'
        snowplow__backfill_limit_days: 90
    given:
      - input: ref('snowplow_identities_stg_identity_events')
        rows:
          - {snowplow_id: 'sp_AAAA', created_at: '2025-12-18 10:00:00.500', event_id: 'evt-001', app_id: 'web', derived_tstamp: '2025-12-18 10:00:00.000', collector_tstamp: '2025-12-18 10:00:00.100', load_tstamp: '2025-12-18 11:00:00.000'}
          - {snowplow_id: 'sp_BBBB', created_at: '2025-12-18 10:01:00.500', event_id: 'evt-002', app_id: 'web', derived_tstamp: '2025-12-18 10:01:00.000', collector_tstamp: '2025-12-18 10:01:00.100', load_tstamp: '2025-12-18 11:00:00.000'}
    expect:
      rows:
        - {snowplow_id: 'sp_AAAA', created_at: '2025-12-18 10:00:00.500', first_seen_event_id: 'evt-001', first_app_id: 'web', last_app_id: 'web', first_derived_tstamp: '2025-12-18 10:00:00.000', last_derived_tstamp: '2025-12-18 10:00:00.000', load_tstamp: '2025-12-18 11:00:00.000'}
        - {snowplow_id: 'sp_BBBB', created_at: '2025-12-18 10:01:00.500', first_seen_event_id: 'evt-002', first_app_id: 'web', last_app_id: 'web', first_derived_tstamp: '2025-12-18 10:01:00.000', last_derived_tstamp: '2025-12-18 10:01:00.000', load_tstamp: '2025-12-18 11:00:00.000'}

  - name: test__snowplow_identities_identities__preserve_historical_values
    description: >
      Incremental: sp_AAAA was stored from run 1 with first_app_id=web at 10:00. A later
      batch brings a 10:30 event. first_* must be preserved and last_* advanced.
    model: snowplow_identities_identities
    config:
      tags: ["snowflake_only"]
    overrides:
      macros:
        is_incremental: true
      vars:
        snowplow__start_date: '2025-12-01'
        snowplow__backfill_limit_days: 90
    given:
      - input: ref('snowplow_identities_stg_identity_events')
        rows:
          - {snowplow_id: 'sp_AAAA', created_at: '2025-12-18 10:00:00.500', event_id: 'evt-008', app_id: 'ios', derived_tstamp: '2025-12-18 10:30:00.000', collector_tstamp: '2025-12-18 10:30:00.100', load_tstamp: '2025-12-18 14:00:00.000'}
      - input: this
        rows:
          - {snowplow_id: 'sp_AAAA', created_at: '2025-12-18 10:00:00.500', first_seen_event_id: 'evt-001', first_app_id: 'web', last_app_id: 'web', first_derived_tstamp: '2025-12-18 10:00:00.000', last_derived_tstamp: '2025-12-18 10:00:00.000', load_tstamp: '2025-12-18 11:00:00.000'}
    expect:
      rows:
        - {snowplow_id: 'sp_AAAA', created_at: '2025-12-18 10:00:00.500', first_seen_event_id: 'evt-001', first_app_id: 'web', last_app_id: 'ios', first_derived_tstamp: '2025-12-18 10:00:00.000', last_derived_tstamp: '2025-12-18 10:30:00.000', load_tstamp: '2025-12-18 14:00:00.000'}

  - name: test__snowplow_identities_identities__late_arriving_earlier_event
    description: >
      A batch delivers an event earlier than what is stored. first_* must move back to the
      newly arrived earlier values while last_* is left alone. load_tstamp must still
      advance, since the row was touched in this window -- otherwise the watermark would go
      backwards and the model would reprocess forever.
    model: snowplow_identities_identities
    config:
      tags: ["snowflake_only"]
    overrides:
      macros:
        is_incremental: true
      vars:
        snowplow__start_date: '2025-12-01'
        snowplow__backfill_limit_days: 90
    given:
      - input: ref('snowplow_identities_stg_identity_events')
        rows:
          - {snowplow_id: 'sp_AAAA', created_at: '2025-12-18 09:00:00.500', event_id: 'evt-late', app_id: 'web', derived_tstamp: '2025-12-18 09:00:00.000', collector_tstamp: '2025-12-18 09:00:00.100', load_tstamp: '2025-12-18 16:00:00.000'}
      - input: this
        rows:
          - {snowplow_id: 'sp_AAAA', created_at: '2025-12-18 10:00:00.500', first_seen_event_id: 'evt-001', first_app_id: 'ios', last_app_id: 'ios', first_derived_tstamp: '2025-12-18 10:00:00.000', last_derived_tstamp: '2025-12-18 10:30:00.000', load_tstamp: '2025-12-18 14:00:00.000'}
    expect:
      rows:
        - {snowplow_id: 'sp_AAAA', created_at: '2025-12-18 09:00:00.500', first_seen_event_id: 'evt-late', first_app_id: 'web', last_app_id: 'ios', first_derived_tstamp: '2025-12-18 09:00:00.000', last_derived_tstamp: '2025-12-18 10:30:00.000', load_tstamp: '2025-12-18 16:00:00.000'}
