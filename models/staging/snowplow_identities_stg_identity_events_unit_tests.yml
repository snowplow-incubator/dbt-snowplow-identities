version: 2
unit_tests:
- name: test__stg_identity_events__initial_gap
  description: Skip only empty/ineligible days, include the first eligible day, and leave the next populated day
    for another batch.
  model: snowplow_identities_stg_identity_events
  overrides:
    macros:
      is_incremental: false
    vars:
      snowplow__start_date: '2020-01-02'
      snowplow__backfill_limit_days: 1
      snowplow__app_id:
      - web
  given:
  - input: source('atomic', 'events')
    format: sql
    rows: |-
      select 'other_app' as event_id, 'other' as app_id,
      'domain' as domain_userid, 'user' as user_id, 'network' as network_userid,
      cast('2020-01-03 12:00:00' as timestamp) as load_tstamp,
      cast('2020-01-03 12:00:00' as timestamp) as collector_tstamp,
      cast('2020-01-03 12:00:00' as timestamp) as derived_tstamp,
      {% if target.type == 'bigquery' %}[struct('ignored' as snowplow_id, timestamp '2020-01-02 00:00:00' as created_at)]
      {% elif target.type in ['databricks', 'spark'] %}from_json('[{"snowplow_id": "ignored", "created_at": "2020-01-02 00:00:00"}]', 'array<struct<snowplow_id:string,created_at:timestamp>>')
      {% else %}parse_json('[{"snowplow_id": "ignored", "created_at": "2020-01-02 00:00:00"}]'){% endif %} as contexts_com_snowplowanalytics_snowplow_identity_2
      union all
      select 'empty' as event_id, 'web' as app_id,
      'domain' as domain_userid, 'user' as user_id, 'network' as network_userid,
      cast('2020-01-04 12:00:00' as timestamp) as load_tstamp,
      cast('2020-01-04 12:00:00' as timestamp) as collector_tstamp,
      cast('2020-01-04 12:00:00' as timestamp) as derived_tstamp,
      {% if target.type == 'bigquery' %}array<struct<snowplow_id string, created_at timestamp>>[]
      {% elif target.type in ['databricks', 'spark'] %}from_json('[]', 'array<struct<snowplow_id:string,created_at:timestamp>>')
      {% else %}parse_json('[]'){% endif %} as contexts_com_snowplowanalytics_snowplow_identity_2
      union all
      select 'eligible' as event_id, 'web' as app_id,
      'domain' as domain_userid, 'user' as user_id, 'network' as network_userid,
      cast('2020-01-10 12:00:00' as timestamp) as load_tstamp,
      cast('2020-01-10 12:00:00' as timestamp) as collector_tstamp,
      cast('2020-01-10 12:00:00' as timestamp) as derived_tstamp,
      {% if target.type == 'bigquery' %}[struct('after_gap' as snowplow_id, timestamp '2020-01-02 00:00:00' as created_at)]
      {% elif target.type in ['databricks', 'spark'] %}from_json('[{"snowplow_id": "after_gap", "created_at": "2020-01-02 00:00:00"}]', 'array<struct<snowplow_id:string,created_at:timestamp>>')
      {% else %}parse_json('[{"snowplow_id": "after_gap", "created_at": "2020-01-02 00:00:00"}]'){% endif %} as contexts_com_snowplowanalytics_snowplow_identity_2
      union all
      select 'later' as event_id, 'web' as app_id,
      'domain' as domain_userid, 'user' as user_id, 'network' as network_userid,
      cast('2020-01-11 12:00:00' as timestamp) as load_tstamp,
      cast('2020-01-11 12:00:00' as timestamp) as collector_tstamp,
      cast('2020-01-11 12:00:00' as timestamp) as derived_tstamp,
      {% if target.type == 'bigquery' %}[struct('next_batch' as snowplow_id, timestamp '2020-01-02 00:00:00' as created_at)]
      {% elif target.type in ['databricks', 'spark'] %}from_json('[{"snowplow_id": "next_batch", "created_at": "2020-01-02 00:00:00"}]', 'array<struct<snowplow_id:string,created_at:timestamp>>')
      {% else %}parse_json('[{"snowplow_id": "next_batch", "created_at": "2020-01-02 00:00:00"}]'){% endif %} as contexts_com_snowplowanalytics_snowplow_identity_2
  expect:
    rows:
    - event_id: eligible
      snowplow_id: after_gap
      load_tstamp: '2020-01-10 12:00:00'
