      {% else %}parse_json('[{"snowplow_id": "next_batch", "created_at": "2020-01-02 00:00:00"}]'){% endif %} as contexts_com_snowplowanalytics_snowplow_identity_2
  - input: this
    rows:
    - event_id: old
      snowplow_id: old
